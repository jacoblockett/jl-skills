name: Installer regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and exercise standalone installer
        shell: bash
        env:
          CI: '1'
        run: bash scripts/test-installer.sh "$PWD/../jl-skill-test-ci"
