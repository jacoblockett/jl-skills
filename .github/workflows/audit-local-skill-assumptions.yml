name: Audit local skill assumptions

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Find repo-owned skill assumptions
        shell: bash
        run: |
          set -euo pipefail
          echo '=== paths and phrases that imply repo-owned skill source ==='
          grep -RInE --exclude-dir=.git --exclude-dir=skills \
            "skills/map|skillsRoot|sourceSkills|runtime-assets|packageStages|JL_SKILL_MAP_EXE|map_executable|Map runtime|Map package|Map archive|build.*Map|package.*Map|skill archive|skill package|repo-level.*skill|repo-owned.*skill|source skill|skills directory|skills/" \
            .github scripts src tests package.json INSTALLER_SPEC.md RELEASES.md TODO.md || true
          echo '=== map-specific test references outside skills/ ==='
          grep -RInE --exclude-dir=.git --exclude-dir=skills \
            "(^|[^A-Za-z])Map([^A-Za-z]|$)|map-windows|map-linux|map-macos|map\.zip|map\.exe|\.jl-skills/map|JL_MAP_CLI" \
            src tests .github scripts package.json INSTALLER_SPEC.md RELEASES.md TODO.md || true
