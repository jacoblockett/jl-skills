name: Workflow parse probe

on:
  schedule:
    - cron: '0 6,7 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        required: true
        default: build
        type: choice
        options:
          - build
          - nightly
          - stable
      force:
        description: Force a nightly even when no build-relevant source changed
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: jls-build-probe
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.mode.outputs.should_build }}
      release_tag: ${{ steps.mode.outputs.release_tag }}
    steps:
      - id: mode
        run: |
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "release_tag=dev" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      matrix:
        include:
          - target: linux-x64-gnu
            runner: ubuntu-24.04
            installer: jls-linux-x64-gnu
    runs-on: "${{ matrix.runner }}"
    env:
      JLS_BUILD_TARGET: ${{ matrix.target }}
      JLS_RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
