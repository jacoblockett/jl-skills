name: Stable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version (for example 0.5.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require main and matching versions
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -ne 'refs/heads/main') {
            throw 'Stable releases may only publish from main.'
          }

          $version = '${{ inputs.version }}'
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Stable release version must be plain semver: $version"
          }

          $source = Get-Content src/jl-skill.ts -Raw
          $match = [regex]::Match($source, 'const VERSION = [''"]([^''"]+)[''"]')
          if (-not $match.Success -or $match.Groups[1].Value -ne $version) {
            throw "src/jl-skill.ts VERSION does not match requested release $version"
          }

          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne $version) {
            throw "package.json version $packageVersion does not match requested release $version"
          }

          git fetch origin --tags --force
          git rev-parse --verify "refs/tags/v$version" 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Tag v$version already exists"
          }

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Install dependencies
        shell: pwsh
        run: bun install --frozen-lockfile

      - name: Build and test from source
        shell: pwsh
        run: bun run smoke

      - name: Verify release manifest
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          $manifest = Get-Content build/jl-skills-manifest.json -Raw | ConvertFrom-Json
          $map = Get-Content skills/map/jl-skill.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne $version) { throw 'Generated release manifest has the wrong installer version.' }
          if ($manifest.skills.map.version -ne $map.version) { throw 'Generated release manifest has the wrong Map version.' }
          if (-not (Test-Path build/jl-skills.exe)) { throw 'build/jl-skills.exe is missing.' }
          if (-not (Test-Path build/map.exe)) { throw 'build/map.exe is missing.' }

      - name: Publish stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v${{ inputs.version }}'
          gh release create $tag build/jl-skills.exe build/map.exe build/jl-skills-manifest.json --title $tag --generate-notes --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Could not publish stable release $tag." }
