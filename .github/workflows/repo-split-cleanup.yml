name: Apply installer-only repository cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Apply repository split cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/repo-split-cleanup.py
          rm -f scripts/repo-split-cleanup.py .github/workflows/repo-split-cleanup.yml

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build installer only
        env:
          JL_SKILLS_BUILD_TARGET: linux-x64-gnu
          JL_SKILLS_RELEASE_TAG: dev
        run: bun run build

      - name: Launch built installer
        run: ./build/jl-skills-linux-x64-gnu --version

      - name: Run generic installer regressions
        run: bun run test:installer

      - name: Verify repository boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -e skills
          test -f catalog.json
          if find build -maxdepth 1 -type f -name '*.zip' | grep -q .; then
            echo 'JLS build unexpectedly produced a skill archive.' >&2
            exit 1
          fi
          if grep -RInE --exclude-dir=.git --exclude-dir=build \
            "skills/map|skillsRoot|sourceSkills|JL_SKILL_MAP_EXE|rustTargetTriple|skillArchiveName|runtimeArtifactPath|map_executable|build/cargo/map" \
            .; then
            echo 'Repo-owned skill build assumptions remain.' >&2
            exit 1
          fi
          git diff --check

      - name: Commit verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make JLS installer-only'
          git push origin HEAD:main
