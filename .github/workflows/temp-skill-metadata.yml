name: Temporary skill metadata compatibility

on:
  push:
    paths:
      - '.github/workflows/temp-skill-metadata.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Allow manifest-backed skill metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/jls.ts')
          text = path.read_text()

          old = "  if (!metadata || metadata.name !== pkg.manifest.name || metadata.version !== pkg.manifest.version || metadata.format !== 1) {"
          new = "  if (metadata && (metadata.name !== pkg.manifest.name || metadata.version !== pkg.manifest.version || metadata.format !== 1)) {"
          if text.count(old) != 1:
              raise SystemExit(f'expected one package metadata condition, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = "    throw new Error(`${pkg.manifest.name} SKILL.md must self-report matching jls metadata`)"
          new = "    throw new Error(`${pkg.manifest.name} SKILL.md jls metadata does not match package manifest`)"
          if text.count(old) != 1:
              raise SystemExit(f'expected one package metadata error, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = "  if (!metadata || metadata.format !== 1) return undefined\n  if (expectedSkill && metadata.name !== expectedSkill) return undefined\n  return metadata"
          new = "  if (metadata) {\n    if (metadata.format !== 1) return undefined\n    if (expectedSkill && metadata.name !== expectedSkill) return undefined\n    return metadata\n  }\n  const manifest = installedPackageManifest(skillPath)\n  if (!manifest) return undefined\n  if (expectedSkill && manifest.name !== expectedSkill) return undefined\n  return { name: manifest.name, version: manifest.version, format: manifest.format }"
          if text.count(old) != 1:
              raise SystemExit(f'expected one installed metadata block, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Verify patch shape
        shell: bash
        run: |
          grep -F 'if (metadata && (metadata.name !== pkg.manifest.name' src/jls.ts
          grep -F 'const manifest = installedPackageManifest(skillPath)' src/jls.ts
          grep -F 'return { name: manifest.name, version: manifest.version, format: manifest.format }' src/jls.ts
      - name: Run JLS tests
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun test --timeout 20000 tests
      - name: Commit compatibility change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/jls.ts
          git diff --cached --quiet && { echo 'No source change produced.' >&2; exit 1; }
          git commit -m 'Allow manifest-backed skill metadata'
          git push origin HEAD:main
