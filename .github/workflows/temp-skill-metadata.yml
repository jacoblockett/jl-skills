name: Temporary skill metadata compatibility

on:
  push:
    paths:
      - '.github/workflows/temp-skill-metadata.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Allow manifest-backed skill metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/jls.ts')
          text = path.read_text()

          old = '''  const metadata = parseSkillMetadata(readFileSync(skillPath, 'utf8'))
          if (!metadata || metadata.name !== pkg.manifest.name || metadata.version !== pkg.manifest.version || metadata.format !== 1) {
            throw new Error(`${pkg.manifest.name} SKILL.md must self-report matching jls metadata`)
          }
          '''
          new = '''  const metadata = parseSkillMetadata(readFileSync(skillPath, 'utf8'))
          if (metadata && (metadata.name !== pkg.manifest.name || metadata.version !== pkg.manifest.version || metadata.format !== 1)) {
            throw new Error(`${pkg.manifest.name} SKILL.md jls metadata does not match package manifest`)
          }
          '''
          if old not in text:
              raise SystemExit('validatePackageMetadata source block not found')
          text = text.replace(old, new, 1)

          old = '''function installedMetadata(skillPath: string, expectedSkill?: string): SkillMetadata | undefined {
            const path = join(skillPath, 'SKILL.md')
            if (!existsSync(path)) return undefined
            const metadata = parseSkillMetadata(readFileSync(path, 'utf8'))
            if (!metadata || metadata.format !== 1) return undefined
            if (expectedSkill && metadata.name !== expectedSkill) return undefined
            return metadata
          }
          '''
          new = '''function installedMetadata(skillPath: string, expectedSkill?: string): SkillMetadata | undefined {
            const path = join(skillPath, 'SKILL.md')
            if (!existsSync(path)) return undefined
            const metadata = parseSkillMetadata(readFileSync(path, 'utf8'))
            if (metadata) {
              if (metadata.format !== 1) return undefined
              if (expectedSkill && metadata.name !== expectedSkill) return undefined
              return metadata
            }
            const manifest = installedPackageManifest(skillPath)
            if (!manifest) return undefined
            if (expectedSkill && manifest.name !== expectedSkill) return undefined
            return { name: manifest.name, version: manifest.version, format: manifest.format }
          }
          '''
          if old not in text:
              raise SystemExit('installedMetadata source block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Verify patch shape
        shell: bash
        run: |
          grep -F 'if (metadata && (metadata.name !== pkg.manifest.name' src/jls.ts
          grep -F 'const manifest = installedPackageManifest(skillPath)' src/jls.ts
          grep -F 'return { name: manifest.name, version: manifest.version, format: manifest.format }' src/jls.ts
      - name: Run JLS tests
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun test --timeout 20000 tests
      - name: Commit compatibility change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/jls.ts
          git diff --cached --quiet && { echo 'No source change produced.' >&2; exit 1; }
          git commit -m 'Allow manifest-backed skill metadata'
          git push origin HEAD:main
