name: Build

on:
  schedule:
    - cron: '0 6,7 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        required: true
        default: build
        type: choice
        options:
          - build
          - nightly
          - stable
      force:
        description: Force a nightly even when no build-relevant source changed
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: jl-skills-${{ github.event_name == 'schedule' && 'nightly' || inputs.action }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      should_build: ${{ steps.mode.outputs.should_build }}
      should_promote: ${{ steps.mode.outputs.should_promote }}
      release_tag: ${{ steps.mode.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail

          mode=nightly
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
            mode='${{ inputs.action }}'
          fi

          if [[ '${{ github.ref }}' != 'refs/heads/main' ]]; then
            echo 'Build and release automation may only run from main.' >&2
            exit 1
          fi

          should_build=true
          should_promote=false
          release_tag=dev

          if [[ "$mode" == nightly ]]; then
            if [[ '${{ github.event_name }}' == 'schedule' ]]; then
              local_hour="$(TZ=America/New_York date +%H)"
              if [[ "$local_hour" != 02 ]]; then
                should_build=false
                echo "Skipping duplicate DST cron at local hour $local_hour."
              fi
            fi

            force='${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}'
            if [[ "$should_build" == true && "$force" != true ]]; then
              git fetch origin --tags --force
              if git rev-parse -q --verify refs/tags/nightly >/dev/null; then
                mapfile -t files < <(git diff --name-only nightly..HEAD -- .github/workflows/build.yml src scripts skills tests package.json bun.lock)
                if (( ${#files[@]} > 0 )); then
                  echo 'Build-relevant changes:'
                  printf '  %s\n' "${files[@]}"
                else
                  should_build=false
                  echo 'No build-relevant changes since the last validated nightly.'
                fi
              fi
            fi
            release_tag=nightly
          elif [[ "$mode" == stable ]]; then
            should_build=false
            should_promote=true
            release_tag="$(date -u +%Y.%m.%d-%H%MZ)"
            git fetch origin --tags --force
            if git rev-parse -q --verify "refs/tags/$release_tag" >/dev/null; then
              echo "Tag $releaseTag already exists." >&2
              exit 1
            fi
          elif [[ "$mode" != build ]]; then
            echo "Unknown build mode: $mode" >&2
            exit 1
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "should_promote=$should_promote" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        if: steps.mode.outputs.mode == 'stable'
        with:
          bun-version: 1.4.0

      - name: Require validated Nightly for Stable
        if: steps.mode.outputs.mode == 'stable'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JL_SKILLS_VALIDATION_SHA: ${{ github.sha }}
          JL_SKILLS_VALIDATION_RECEIPT: build/validation/validation.json
          JL_SKILLS_VALIDATION_MANIFEST: build/validation/manifest.json
        run: |
          set -euo pipefail
          mkdir -p build/validation
          gh release download nightly -p validation.json -D build/validation --clobber
          gh release download nightly -p manifest.json -D build/validation --clobber
          bun scripts/validation-receipt.ts verify

      - name: No release build
        if: steps.mode.outputs.should_build != 'true' && steps.mode.outputs.should_promote != 'true'
        run: echo 'Nothing to build or publish.'

  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
            installer: jl-skills-windows-x64.exe
            map_executable: map.exe
          - target: windows-arm64
            runner: windows-11-vs2026-arm
            rust_target: aarch64-pc-windows-msvc
            installer: jl-skills-windows-arm64.exe
            map_executable: map.exe
          - target: macos-x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            installer: jl-skills-macos-x64
            map_executable: map
          - target: macos-arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            installer: jl-skills-macos-arm64
            map_executable: map
          - target: linux-x64-gnu
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            installer: jl-skills-linux-x64-gnu
            map_executable: map
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            installer: jl-skills-linux-arm64-gnu
            map_executable: map
          - target: linux-x64-musl
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
            installer: jl-skills-linux-x64-musl
            map_executable: map
          - target: linux-arm64-musl
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            installer: jl-skills-linux-arm64-musl
            map_executable: map
    runs-on: ${{ matrix.runner }}
    env:
      JL_SKILLS_BUILD_TARGET: ${{ matrix.target }}
      JL_SKILLS_RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.rust_target }}

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl musl-tools
          if [[ '${{ matrix.target }}' == 'linux-x64-musl' ]]; then
            echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
          else
            echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
          fi

      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/cargo/map
          key: ${{ matrix.target }}-rust-1.97.1-map-${{ hashFiles('skills/map/Cargo.lock', 'skills/map/Cargo.toml') }}
          restore-keys: |
            ${{ matrix.target }}-rust-1.97.1-map-

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Test Map runtime for target
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release \
            --manifest-path skills/map/Cargo.toml \
            --target '${{ matrix.rust_target }}' \
            --target-dir build/cargo/map

      - name: Build target release artifacts
        shell: bash
        run: bun run build

      - name: Launch compiled target artifacts
        if: ${{ !endsWith(matrix.target, '-musl') }}
        shell: bash
        run: |
          set -euo pipefail
          './build/${{ matrix.installer }}' --version
          './build/cargo/map/${{ matrix.rust_target }}/release/${{ matrix.map_executable }}' --help >/dev/null

      - name: Run musl consumer acceptance in Alpine
        if: ${{ endsWith(matrix.target, '-musl') }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user root \
            --entrypoint sh \
            -e JL_SKILLS_BUILD_TARGET='${{ matrix.target }}' \
            -e JL_SKILLS_RELEASE_TAG='${{ needs.prepare.outputs.release_tag }}' \
            -v "$PWD:/work" \
            -w /work \
            oven/bun:1.4.0-alpine \
            -lc "
              apk add --no-cache libgcc libstdc++ >/dev/null &&
              bun install --frozen-lockfile &&
              ./build/${{ matrix.installer }} --version &&
              ./build/cargo/map/${{ matrix.rust_target }}/release/${{ matrix.map_executable }} --help >/dev/null &&
              bun run test:consumer
            "

      - name: Run full installer regression suite
        if: matrix.target == 'windows-x64'
        shell: bash
        run: bun run test:installer

      - name: Run consumer acceptance
        if: ${{ !endsWith(matrix.target, '-musl') }}
        shell: bash
        run: bun run test:consumer

      - name: Run target contract tests
        shell: bash
        run: bun test --timeout 20000 tests/targets.test.ts

      - name: Save Rust build cache
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/cargo/map
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

      - name: Upload target artifacts
        uses: actions/upload-artifact@v4
        with:
          name: target-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/${{ matrix.installer }}
            build/manifest.json
            build/*-${{ matrix.target }}.zip
            build/*-portable.zip

  aggregate:
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Download all target artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: target-*
          path: build/targets
          merge-multiple: false

      - name: Aggregate and verify complete release
        env:
          JL_SKILLS_RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          JL_SKILLS_AGGREGATE_INPUT: build/targets
          JL_SKILLS_AGGREGATE_OUTPUT: build/release
        run: bun scripts/aggregate-release.ts

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          if-no-files-found: error
          retention-days: 14
          path: build/release/*

  publish-nightly:
    needs:
      - prepare
      - aggregate
    if: needs.prepare.outputs.should_build == 'true' && needs.prepare.outputs.mode == 'nightly'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: build/release

      - name: Publish Nightly candidate assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find build/release -maxdepth 1 -type f -print | sort)
          if (( ${#assets[@]} == 0 )); then
            echo 'Verified release bundle is empty.' >&2
            exit 1
          fi

          if gh release view nightly >/dev/null 2>&1; then
            gh release delete-asset nightly validation.json -y >/dev/null 2>&1 || true
            gh release upload nightly "${assets[@]}" --clobber
            mapfile -t existing < <(gh release view nightly --json assets --jq '.assets[].name')
            for name in "${existing[@]}"; do
              if [[ "$name" == validation.json ]]; then
                continue
              fi
              if [[ ! -f "build/release/$name" ]]; then
                gh release delete-asset nightly "$name" -y
              fi
            done
          else
            gh release create nightly "${assets[@]}" \
              --title 'Nightly' \
              --notes 'Rolling production-test build from main. Not part of the stable update channel.' \
              --prerelease \
              --target "$GITHUB_SHA"
          fi

  distribution:
    needs:
      - prepare
      - publish-nightly
    if: needs.prepare.outputs.should_build == 'true' && needs.prepare.outputs.mode == 'nightly'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
            installer: jl-skills-windows-x64.exe
            map_archive: map-windows-x64.zip
          - target: windows-arm64
            runner: windows-11-vs2026-arm
            installer: jl-skills-windows-arm64.exe
            map_archive: map-windows-arm64.zip
          - target: macos-x64
            runner: macos-15-intel
            installer: jl-skills-macos-x64
            map_archive: map-macos-x64.zip
          - target: macos-arm64
            runner: macos-15
            installer: jl-skills-macos-arm64
            map_archive: map-macos-arm64.zip
          - target: linux-x64-gnu
            runner: ubuntu-24.04
            installer: jl-skills-linux-x64-gnu
            map_archive: map-linux-x64-gnu.zip
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            installer: jl-skills-linux-arm64-gnu
            map_archive: map-linux-arm64-gnu.zip
          - target: linux-x64-musl
            runner: ubuntu-24.04
            installer: jl-skills-linux-x64-musl
            map_archive: map-linux-x64-musl.zip
          - target: linux-arm64-musl
            runner: ubuntu-24.04-arm
            installer: jl-skills-linux-arm64-musl
            map_archive: map-linux-arm64-musl.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Install GNU Linux distribution tools
        if: ${{ startsWith(matrix.target, 'linux-') && !endsWith(matrix.target, '-musl') }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y binutils file

      - name: Download actual Nightly release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root='build/distribution/${{ matrix.target }}'
          mkdir -p "$root"
          gh release download nightly -p manifest.json -D "$root" --clobber
          gh release download nightly -p '${{ matrix.installer }}' -D "$root" --clobber
          gh release download nightly -p '${{ matrix.map_archive }}' -D "$root" --clobber

      - name: Audit consumer distribution behavior
        if: ${{ !endsWith(matrix.target, '-musl') }}
        shell: bash
        env:
          JL_SKILLS_DISTRIBUTION_TARGET: ${{ matrix.target }}
          JL_SKILLS_DISTRIBUTION_ROOT: build/distribution/${{ matrix.target }}
          JL_SKILLS_DISTRIBUTION_REPORT: build/distribution-reports/${{ matrix.target }}.json
          JL_SKILLS_RELEASE_TAG: nightly
        run: bun scripts/audit-distribution.ts

      - name: Audit musl consumer distribution behavior in Alpine
        if: ${{ endsWith(matrix.target, '-musl') }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/distribution-reports
          docker run --rm \
            --user root \
            --entrypoint sh \
            -e JL_SKILLS_DISTRIBUTION_TARGET='${{ matrix.target }}' \
            -e JL_SKILLS_DISTRIBUTION_ROOT='/work/build/distribution/${{ matrix.target }}' \
            -e JL_SKILLS_DISTRIBUTION_REPORT='/work/build/distribution-reports/${{ matrix.target }}.json' \
            -e JL_SKILLS_RELEASE_TAG=nightly \
            -v "$PWD:/work" \
            -w /work \
            oven/bun:1.4.0-alpine \
            -lc "
              apk add --no-cache binutils file libgcc libstdc++ >/dev/null &&
              bun install --frozen-lockfile &&
              bun scripts/audit-distribution.ts
            "

      - name: Upload distribution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30
          path: build/distribution-reports/${{ matrix.target }}.json

  finalize-nightly:
    needs:
      - prepare
      - distribution
    if: needs.prepare.outputs.should_build == 'true' && needs.prepare.outputs.mode == 'nightly'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Download distribution reports
        uses: actions/download-artifact@v4
        with:
          pattern: distribution-*
          path: build/distribution-reports
          merge-multiple: true

      - name: Download validated Nightly manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/validation
          gh release download nightly -p manifest.json -D build/validation --clobber

      - name: Create validation receipt
        env:
          JL_SKILLS_VALIDATION_REPORTS: build/distribution-reports
          JL_SKILLS_VALIDATION_MANIFEST: build/validation/manifest.json
          JL_SKILLS_VALIDATION_OUTPUT: build/validation/validation.json
          JL_SKILLS_VALIDATION_SHA: ${{ github.sha }}
          JL_SKILLS_VALIDATION_RUN_ID: ${{ github.run_id }}
        run: bun scripts/validation-receipt.ts create

      - name: Finalize validated Nightly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload nightly build/validation/validation.json --clobber
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f nightly "$GITHUB_SHA"
          git push origin refs/tags/nightly --force

      - uses: actions/upload-artifact@v4
        with:
          name: nightly-validation
          if-no-files-found: error
          retention-days: 90
          path: build/validation/validation.json

  publish-stable:
    needs: prepare
    if: needs.prepare.outputs.should_promote == 'true' && needs.prepare.outputs.mode == 'stable'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Download validated Nightly snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/promotion-source
          gh release download nightly -D build/promotion-source --clobber

      - name: Reverify Nightly validation receipt
        env:
          JL_SKILLS_VALIDATION_SHA: ${{ github.sha }}
          JL_SKILLS_VALIDATION_RECEIPT: build/promotion-source/validation.json
          JL_SKILLS_VALIDATION_MANIFEST: build/promotion-source/manifest.json
        run: bun scripts/validation-receipt.ts verify

      - name: Promote exact validated assets
        env:
          JL_SKILLS_RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          JL_SKILLS_PROMOTION_INPUT: build/promotion-source
          JL_SKILLS_PROMOTION_OUTPUT: build/release
        run: bun scripts/promote-nightly.ts

      - name: Upload Stable candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: stable-${{ needs.prepare.outputs.release_tag }}
          if-no-files-found: error
          retention-days: 90
          path: build/release/*

      - name: Publish immutable Stable snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ needs.prepare.outputs.release_tag }}'
          mapfile -t assets < <(find build/release -maxdepth 1 -type f -print | sort)
          if (( ${#assets[@]} == 0 )); then
            echo 'Stable promotion bundle is empty.' >&2
            exit 1
          fi
          gh release create "$tag" "${assets[@]}" \
            --title "$tag" \
            --generate-notes \
            --target "$GITHUB_SHA"
