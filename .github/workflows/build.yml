name: Build binaries

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Install dependencies
        shell: pwsh
        run: bun install --frozen-lockfile

      - name: Build and test from source
        shell: pwsh
        run: bun run smoke

      - name: Upload production-test binaries
        uses: actions/upload-artifact@v4
        with:
          name: jl-skills-windows-x64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/jl-skills.exe
            build/map.exe
            build/jl-skills-manifest.json
