name: Build

on:
  schedule:
    - cron: '0 6,7 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        required: true
        default: build
        type: choice
        options:
          - build
          - nightly
          - stable
      force:
        description: Force a nightly even when no build-relevant source changed
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: jl-skills-${{ github.event_name == 'schedule' && 'nightly' || inputs.action }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve mode
        id: mode
        shell: pwsh
        run: |
          $mode = 'nightly'
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $mode = '${{ inputs.action }}'
          }

          if ('${{ github.ref }}' -ne 'refs/heads/main') {
            throw 'Build and release automation may only run from main.'
          }

          $shouldBuild = $true
          $releaseTag = 'dev'

          if ($mode -eq 'nightly' -or $mode -eq 'stable') {
            $shouldBuild = $false
            Write-Host 'Nightly and Stable publication are temporarily blocked while the required cross-platform target matrix is incomplete.'
          }

          if ($mode -eq 'nightly') {
            if ($shouldBuild -and '${{ github.event_name }}' -eq 'schedule') {
              $eastern = [TimeZoneInfo]::FindSystemTimeZoneById('Eastern Standard Time')
              $local = [TimeZoneInfo]::ConvertTimeFromUtc([DateTime]::UtcNow, $eastern)
              if ($local.Hour -ne 2) {
                $shouldBuild = $false
                Write-Host "Skipping duplicate DST cron at local hour $($local.Hour)."
              }
            }

            $force = '${{ inputs.force }}' -eq 'true'
            if ($shouldBuild -and -not $force) {
              git fetch origin --tags --force
              $base = (& git tag --list nightly | Select-Object -First 1)
              if ($base) {
                $files = @(git diff --name-only "$base..HEAD" -- src scripts skills package.json bun.lock)
                if ($LASTEXITCODE -ne 0) { throw 'Could not compare against the previous nightly tag.' }
                $shouldBuild = $files.Count -gt 0
                if ($shouldBuild) {
                  Write-Host 'Build-relevant changes:'
                  $files | ForEach-Object { Write-Host "  $_" }
                } else {
                  Write-Host 'No build-relevant changes since the last successful nightly.'
                }
              }
            }
            $releaseTag = 'nightly'
          } elseif ($mode -eq 'stable') {
            $releaseTag = [DateTime]::UtcNow.ToString('yyyy.MM.dd-HHmmZ')
            if ($shouldBuild) {
              git fetch origin --tags --force
              $existingTag = (& git tag --list $releaseTag | Select-Object -First 1)
              if ($existingTag) { throw "Tag $releaseTag already exists." }
            }
          }

          "mode=$mode" >> $env:GITHUB_OUTPUT
          "should_build=$($shouldBuild.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT

      - name: No release build
        if: steps.mode.outputs.should_build != 'true'
        shell: pwsh
        run: Write-Host 'Nothing to build or publish.'

      - uses: oven-sh/setup-bun@v2
        if: steps.mode.outputs.should_build == 'true'
        with:
          bun-version: 1.4.0

      - uses: dtolnay/rust-toolchain@stable
        if: steps.mode.outputs.should_build == 'true'
        with:
          toolchain: 1.97.1

      - name: Restore Rust build cache
        id: rust-cache
        if: steps.mode.outputs.should_build == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/cargo/map
          key: windows-x64-rust-1.97.1-map-${{ hashFiles('skills/map/Cargo.lock', 'skills/map/Cargo.toml') }}
          restore-keys: |
            windows-x64-rust-1.97.1-map-

      - name: Install dependencies
        if: steps.mode.outputs.should_build == 'true'
        shell: pwsh
        run: bun install --frozen-lockfile

      - name: Build and test from source
        if: steps.mode.outputs.should_build == 'true'
        shell: pwsh
        env:
          JL_SKILLS_RELEASE_TAG: ${{ steps.mode.outputs.release_tag }}
        run: bun run smoke

      - name: Save Rust build cache
        if: always() && steps.mode.outputs.should_build == 'true' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/cargo/map
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

      - name: Upload production-test artifacts
        if: steps.mode.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            build/jl-skills.exe
            build/manifest.json
            build/*.zip

      - name: Publish rolling nightly
        if: steps.mode.outputs.should_build == 'true' && steps.mode.outputs.mode == 'nightly'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @('build/jl-skills.exe', 'build/manifest.json') + @(Get-ChildItem build/*.zip | ForEach-Object { $_.FullName })
          $existingRelease = (& gh release list --limit 100 --json tagName --jq '.[] | select(.tagName == "nightly") | .tagName' | Select-Object -First 1)
          if (-not $existingRelease) {
            gh release create nightly @assets --title 'Nightly' --notes 'Rolling production-test build from main. Not part of the stable update channel.' --prerelease --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the nightly prerelease.' }
          } else {
            gh release upload nightly @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not upload nightly artifacts.' }
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -f nightly $env:GITHUB_SHA
            git push origin refs/tags/nightly --force
            if ($LASTEXITCODE -ne 0) { throw 'Could not advance the nightly tag.' }
          }

      - name: Publish stable snapshot
        if: steps.mode.outputs.should_build == 'true' && steps.mode.outputs.mode == 'stable'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.mode.outputs.release_tag }}'
          $assets = @('build/jl-skills.exe', 'build/manifest.json') + @(Get-ChildItem build/*.zip | ForEach-Object { $_.FullName })
          gh release create $tag @assets --title $tag --generate-notes --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Could not publish stable release $tag." }