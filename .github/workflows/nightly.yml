name: Nightly build

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build even when no build-relevant source changed
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require main
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -ne 'refs/heads/main') {
            throw 'Nightly builds may only publish from main.'
          }

      - name: Detect build-relevant changes
        id: changes
        shell: pwsh
        run: |
          git fetch origin --tags --force
          $force = $false
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $force = '${{ inputs.force }}' -eq 'true'
          }
          $changed = $force

          if (-not $changed) {
            $base = (& git rev-parse --verify refs/tags/nightly 2>$null)
            if ($LASTEXITCODE -ne 0 -or -not $base) {
              $changed = $true
            } else {
              $files = @(git diff --name-only "$base..HEAD" -- src scripts skills package.json bun.lock)
              if ($LASTEXITCODE -ne 0) { throw 'Could not compare against the previous nightly tag.' }
              $changed = $files.Count -gt 0
              if ($changed) {
                Write-Host 'Build-relevant changes:'
                $files | ForEach-Object { Write-Host "  $_" }
              }
            }
          }

          "changed=$($changed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: No source changes
        if: steps.changes.outputs.changed != 'true'
        shell: pwsh
        run: Write-Host 'No build-relevant changes since the last successful nightly.'

      - uses: oven-sh/setup-bun@v2
        if: steps.changes.outputs.changed == 'true'
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.changed == 'true'
        with:
          toolchain: 1.97.1

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        shell: pwsh
        run: bun install --frozen-lockfile

      - name: Build and test from source
        if: steps.changes.outputs.changed == 'true'
        shell: pwsh
        run: bun run smoke

      - name: Publish rolling nightly prerelease
        if: steps.changes.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          gh release view nightly *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create nightly build/jl-skills.exe build/map.exe --title 'Nightly' --notes 'Rolling production-test build from main. Not part of the stable update channel.' --prerelease --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the nightly prerelease.' }
          } else {
            gh release upload nightly build/jl-skills.exe build/map.exe --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not upload nightly artifacts.' }
            git tag -f nightly $env:GITHUB_SHA
            git push origin refs/tags/nightly --force
            if ($LASTEXITCODE -ne 0) { throw 'Could not advance the nightly tag.' }
          }
