name: Normalize JLS version

on:
  push:
    paths:
      - .github/workflows/version-normalize.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Normalize unreleased product version
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/"version": "0\.7\.0"/"version": "1.0.0"/' package.json
          sed -i "s/const VERSION = '0\.7\.0'/const VERSION = '1.0.0'/" src/jls.ts
          sed -i 's/0\.7\.0/1.0.0/g' SPEC.md
          printf '%s\n' 'Remaining 0.7.0 references (test fixtures are allowed):'
          grep -RIn --exclude=README.md --exclude=version-normalize.yml --exclude-dir=.git '0\.7\.0' package.json src scripts tests SPEC.md .github/workflows/build.yml || true
          grep -q '"version": "1.0.0"' package.json
          grep -q "const VERSION = '1.0.0'" src/jls.ts
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run installer tests
        run: bun run test:installer
      - name: Build and launch installer
        env:
          JLS_BUILD_TARGET: linux-x64-gnu
        run: |
          bun run build
          test "$(./build/jls-linux-x64-gnu --version)" = 'jls 1.0.0'
      - name: Commit normalized version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json src/jls.ts SPEC.md
          git diff --cached --quiet && exit 0
          git commit -m 'Normalize JLS version to 1.0.0'
          git push
