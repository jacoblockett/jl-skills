name: Final JLS cleanup audit

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Normalize JLS product naming
        shell: bash
        run: |
          set -euo pipefail
          git mv src/jl-skill.ts src/jls.ts
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          replacements = [
              ('JL_SKILLS', 'JLS'),
              ('JL-Skills', 'JLS'),
              ('jl-skills', 'jls'),
              ('jl-skill', 'jls'),
          ]

          for raw in subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0'):
              if not raw:
                  continue
              path = Path(raw.decode())
              if str(path).startswith('.github/workflows/'):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, FileNotFoundError, IsADirectoryError):
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build installer
        env:
          JLS_BUILD_TARGET: linux-x64-gnu
          JLS_RELEASE_TAG: dev
        run: bun run build

      - name: Launch installer
        run: ./build/jls-linux-x64-gnu --version

      - name: Run installer tests
        run: bun run test:installer

      - name: Verify installer-only boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -e skills
          test -f catalog.json
          test -f src/jls.ts
          test ! -e src/jl-skill.ts
          test -f build/jls-linux-x64-gnu
          if find build -maxdepth 1 -type f -name '*.zip' | grep -q .; then
            echo 'JLS unexpectedly produced a skill archive.' >&2
            exit 1
          fi
          if git grep -nE 'skills/map|build/cargo/map|map-windows-|map-linux-|map-macos-' -- ':!.github/workflows/*' ':!README.md' ':!catalog.json' ':!RELEASES.md' ':!TODO.md'; then
            echo 'Skill-owned build/package assumptions remain in JLS.' >&2
            exit 1
          fi
          if git grep -nE 'jl-skills|jl-skill|JL_SKILLS|JL-Skills|\.jl-skills' -- ':!.github/workflows/*'; then
            echo 'Legacy product naming remains outside workflows.' >&2
            exit 1
          fi
          git diff --check

      - name: Commit verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows/*'
          if git diff --cached --quiet; then
            echo 'No non-workflow cleanup changes needed.'
            exit 0
          fi
          git commit -m 'Finish JLS installer-only cleanup'
          git push origin HEAD:main
