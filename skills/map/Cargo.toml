[package]
name = "map-runtime"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
description = "Durable local intent graph runtime"
license = "MIT"

[[bin]]
name = "map"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
aws-lc-sys = { version = "=0.44.0", features = ["prebuilt-nasm"] }
clap = { version = "4.5", features = ["derive"] }
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
surrealdb = { version = "=3.2.4", default-features = false, features = ["kv-surrealkv"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3.20"
