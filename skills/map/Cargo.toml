[package]
name = "map-runtime"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
description = "Durable local intent graph runtime"
license = "MIT"

[[bin]]
name = "map"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
surrealdb = { version = "=2.3.10", default-features = false, features = ["kv-surrealkv"] }
surrealkv = "=0.9.1"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
