[project]
name = "jl-map-prototype"
version = "0.1.0"
description = "Prototype durable intent graph for the /map skill"
requires-python = ">=3.11"
dependencies = [
  "surrealdb==2.0.0",
]

[project.scripts]
map = "map_cli:main"

[tool.setuptools]
py-modules = ["map_cli", "map_state", "map_entry", "map_query", "map_agent_query", "map_session"]